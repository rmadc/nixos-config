name: telegram

services:
  hb-status:
    build:
      context: .
      args:
        JOB: hb-status
    image: telegram-hb-status:local
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - TG-hb-status:/data/tg
    secrets:
      - settings
      - telegram-api
  mark-as-read:
    build:
      context: .
      args:
        JOB: mark-as-read
    image: telegram-mark-as-read:local
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - TG-mark-as-read:/data/tg
    secrets:
      - settings
      - telegram-api
  moon-clock:
    build:
      context: .
      args:
        JOB: moon-clock
    image: telegram-moon-clock:local
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'
    volumes:
      - TG-moon-clock:/data/moon
    secrets:
      - settings
      - moon-token

volumes:
  TG-hb-status:
    name: TG-hb-status
  TG-mark-as-read:
    name: TG-mark-as-read
  TG-moon-clock:
    name: TG-moon-clock

secrets:
  settings:
    file: /var/lib/telegram-jobs/secrets/settings.json
  telegram-api:
    file: /var/lib/telegram-jobs/secrets/api_data.json
  moon-token:
    file: /var/lib/telegram-jobs/secrets/moon-token
