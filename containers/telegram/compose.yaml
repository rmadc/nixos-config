name: telegram

services:
  jobs:
    build: .
    image: telegram-jobs:local
    restart: unless-stopped
    volumes:
      - TG-data:/data/tg
      - TG-moon:/data/moon
      - TG-logs:/data/logs
    secrets:
      - settings
      - telegram-api
      - moon-token

volumes:
  TG-data:
    name: TG-data
  TG-moon:
    name: TG-moon
  TG-logs:
    name: TG-logs

secrets:
  settings:
    file: /var/lib/telegram-jobs/secrets/settings.json
  telegram-api:
    file: /var/lib/telegram-jobs/secrets/api_data.json
  moon-token:
    file: /var/lib/telegram-jobs/secrets/moon-token
