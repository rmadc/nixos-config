name: telegram

services:
  hb-status:
    build:
      context: .
      args:
        JOB: hb-status
    image: telegram-hb-status:local
    restart: unless-stopped
    volumes:
      - TG-data:/data/tg
      - TG-logs:/data/logs
    secrets:
      - settings
      - telegram-api
  mark-as-read:
    build:
      context: .
      args:
        JOB: mark-as-read
    image: telegram-mark-as-read:local
    restart: unless-stopped
    volumes:
      - TG-data:/data/tg
      - TG-logs:/data/logs
    secrets:
      - settings
      - telegram-api
  moon-clock:
    build:
      context: .
      args:
        JOB: moon-clock
    image: telegram-moon-clock:local
    restart: unless-stopped
    volumes:
      - TG-moon:/data/moon
      - TG-logs:/data/logs
    secrets:
      - settings
      - moon-token

volumes:
  TG-data:
    name: TG-data
  TG-moon:
    name: TG-moon
  TG-logs:
    name: TG-logs

secrets:
  settings:
    file: /var/lib/telegram-jobs/secrets/settings.json
  telegram-api:
    file: /var/lib/telegram-jobs/secrets/api_data.json
  moon-token:
    file: /var/lib/telegram-jobs/secrets/moon-token
